name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - env:
          TARGET_BRANCH: ${{ github.ref_name }}
          UPSTREAM_URL: https://github.com/chrisgliddon/bevy-skills
          UPSTREAM_BRANCH: main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --no-rebase --no-commit --no-ff "$UPSTREAM_URL" "$UPSTREAM_BRANCH"
          test -f skills/bevy-generative/SKILL.md
          test -d skills && test -d .github/workflows && test -f LICENSE
          if git rev-parse --verify --quiet MERGE_HEAD >/dev/null || ! git diff --cached --quiet; then
            git commit -m "chore: sync upstream skills"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
