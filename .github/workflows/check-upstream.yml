name: Check upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git pull --ff-only https://github.com/chrisgliddon/bevy-skills main
          test -d skills/bevy-generative
          test -d skills && test -d .github/workflows && test -f LICENSE
          git push origin HEAD:${{ github.ref_name }}
