name: Check upstream

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git pull --ff-only https://github.com/chrisgliddon/bevy-skills main
          test -d skills/bevy-generative
