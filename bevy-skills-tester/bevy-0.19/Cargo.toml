[package]
name = "bevy-skills-tester"
version = "0.1.1"
edition = "2024"

[dependencies]
bevy = { version = "0.19", features = [
    "bevy_world_serialization",
    "free_camera",
    "ktx2",
    "pan_camera",
    "serialize",
    "system_font_discovery",
    "zstd_rust",
] }
bevy_capture = { version = "0.6.0", features = ["mp4_openh264"] }
bevy_generative = { git = "https://github.com/ParkSnoopy/bevy_generative", tag = "b0.19.0" }
bevy_hanabi = "0.19.0"
bevy_rapier3d = "0.36"
block-mesh = "0.2.0"
es-fluent = { version = "0.18.1", features = ["derive"] }
es-fluent-manager-bevy = { version = "0.19.2", features = ["macros"] }
ron = "0.12"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
unic-langid = { version = "0.9", features = ["macros"] }
